<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<!-- viewport-fit=cover lets the installed app draw under the iPhone status bar; layouts pad for it.
		     resizes-content: on Android the page shrinks above the keyboard instead of being covered by
		     it, so the full-screen Santa chat keeps its messages in view while typing. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<title>Secret Santa</title>
		<meta
			name="description"
			content="Draw names, share wishlists and plan your gift exchange with family and friends."
		/>
		<!-- Link previews (iMessage, WhatsApp, Slack, Facebook...). %SITE_URL% is filled in at build time (vite.config.ts). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Secret Santa" />
		<meta property="og:title" content="Secret Santa" />
		<meta
			property="og:description"
			content="Draw names, share wishlists and plan your gift exchange with family and friends."
		/>
		<meta property="og:url" content="%SITE_URL%/" />
		<meta property="og:image" content="%SITE_URL%/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="A Santa hat beside the words Secret Santa, on a dark green background with snowflakes."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#1a3a2e" />
		<!-- Installing to the home screen: the manifest for Android/Chrome, and Apple's own tags for iPhone. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Light or dark before the page draws, so dark mode doesn't flash white. A file rather than an
		     inline script, so the Content-Security-Policy can allow only the site's own scripts. -->
		<script src="/color-scheme.js"></script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Secret Santa" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="app"></div>
		<!-- What the About page (/about) says, for readers that don't run JavaScript (Google's app
		     review among them). Keep in step with Components/About/AboutPage.tsx. -->
		<noscript>
			<h1>Secret Santa</h1>
			<p>The easy way to run a gift exchange with family and friends. Free, with no ads.</p>
			<ul>
				<li>Draw names: start a group, invite everyone with a link or code, and draw names in one tap.</li>
				<li>
					Share wishlists: others claim what they'll buy so nobody doubles up, and you never see what's been claimed.
				</li>
				<li>Ask your Santa: ask the person you're buying for about sizes or hints without giving yourself away.</li>
				<li>Kids and pets too: keep wishlists for kids and pets who don't have their own account.</li>
			</ul>
			<p>Secret Santa needs JavaScript turned on. <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
		</noscript>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
