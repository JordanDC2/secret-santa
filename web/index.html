<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<!-- viewport-fit=cover lets the installed app draw under the iPhone status bar; layouts pad for it. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Secret Santa</title>
		<meta
			name="description"
			content="Draw names, share wishlists and plan your gift exchange with family and friends."
		/>
		<!-- Link previews (iMessage, WhatsApp, Slack, Facebook...). %SITE_URL% is filled in at build time (vite.config.ts). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Secret Santa" />
		<meta property="og:title" content="Secret Santa" />
		<meta
			property="og:description"
			content="Draw names, share wishlists and plan your gift exchange with family and friends."
		/>
		<meta property="og:url" content="%SITE_URL%/" />
		<meta property="og:image" content="%SITE_URL%/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="A Santa hat beside the words Secret Santa, on a dark green background with snowflakes."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#1a3a2e" />
		<!-- Installing to the home screen: the manifest for Android/Chrome, and Apple's own tags for iPhone. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Light or dark before the page draws, so dark mode doesn't flash white. Same key and rule as
		     the app's colorSchemeManager (Components/App.tsx): a saved choice, else the system setting. -->
		<script>
			try {
				var saved = localStorage.getItem("secret-santa-color-scheme");
				var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.setAttribute("data-mantine-color-scheme", dark ? "dark" : "light");
			} catch (error) {
				// Storage blocked (private browsing): the app sorts it out once it loads.
			}
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Secret Santa" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
